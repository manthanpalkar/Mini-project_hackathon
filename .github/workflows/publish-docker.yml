name: Publish Docker Containers to GitHub Packages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/publish-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repository and image names
        id: names
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_tag_latest=ghcr.io/${REPO_LC}-backend:latest" >> $GITHUB_OUTPUT
          echo "backend_tag_sha=ghcr.io/${REPO_LC}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "frontend_tag_latest=ghcr.io/${REPO_LC}-frontend:latest" >> $GITHUB_OUTPUT
          echo "frontend_tag_sha=ghcr.io/${REPO_LC}-frontend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.backend_tag_latest }}
            ${{ steps.names.outputs.backend_tag_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=LOOP SPIT Backend API Service

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.names.outputs.frontend_tag_latest }}
            ${{ steps.names.outputs.frontend_tag_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=LOOP SPIT Frontend Web Application
