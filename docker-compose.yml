# ==============================================================================
# LOOP SPIT — Production Docker Compose Orchestration
# Runs unprivileged frontend (Nginx SPA + Reverse Proxy) and backend (Node.js LTS)
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: loop-backend:latest
    container_name: loop-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5001
      - HOST=0.0.0.0
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - RESET_SECRET=${RESET_SECRET:-}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:8080}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - REDIS_URL=${REDIS_URL:-}
      - GRIDFS_BUCKET_NAME=${GRIDFS_BUCKET_NAME:-loop_resources}
      - GRIDFS_CHUNK_SIZE_MB=${GRIDFS_CHUNK_SIZE_MB:-8}
      - GRIDFS_UPLOAD_CONCURRENCY=${GRIDFS_UPLOAD_CONCURRENCY:-6}
      - RESUME_MAX_FILE_SIZE_BYTES=${RESUME_MAX_FILE_SIZE_BYTES:-10485760}
    expose:
      - "5001"
    # Keep backend private by default. Uncomment to expose direct host port:
    # ports:
    #   - "${BACKEND_PORT:-5001}:5001"
    networks:
      - loop-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: loop-frontend:latest
    container_name: loop-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - loop-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  loop-network:
    name: loop-network
    driver: bridge
